name: Deploy Valaxy Site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile # 👈 加上这个参数，防止本地和云端 lockfile 微调导致报错

      - name: Build Site
        run: pnpm run build

      - name: Verify build output # 👈 防止 SSG 渲染失败仍退出 0 时，用残缺 dist 覆盖线上站点
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html 缺失，构建未产出 HTML，终止部署"; exit 1; }

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: shouw.blog
          nojekyll: true